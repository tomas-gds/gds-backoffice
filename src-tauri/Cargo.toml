[package]
name = "tools-workspace"
version = "0.1.0"
description = "Modular local tools workspace"
authors = ["Tools Workspace Team"]
edition = "2021"

[lib]
name = "tools_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
dirs = "6"
tauri-plugin-shell = "2"
